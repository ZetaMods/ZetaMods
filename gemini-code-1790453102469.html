<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZetaMods - Juegos Modificados para Móvil</title>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #121212; color: #fff; padding: 20px; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        h1 { color: #00ff88; }
        button { background: #00ff88; border: none; padding: 10px 15px; font-weight: bold; cursor: pointer; border-radius: 5px; }
        .container { max-width: 800px; margin: 0 auto; }
        .game-card { background: #1e1e1e; padding: 15px; margin-bottom: 15px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
        .game-info h3 { margin-bottom: 5px; color: #fff; }
        .game-info p { color: #aaa; font-size: 14px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; }
        .modal-content { background: #1e1e1e; padding: 20px; border-radius: 8px; width: 90%; max-width: 400px; }
        .modal-content input, .modal-content textarea { width: 100%; padding: 10px; margin-bottom: 10px; background: #2c2c2c; border: 1px solid #444; color: #fff; border-radius: 5px; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>ZetaMods 🚀</h1>
            <button onclick="abrirAdmin()">Panel Admin</button>
        </header>

        <div id="games-list">
            <p>Cargando juegos...</p>
        </div>
    </div>

    <!-- Modal de Administración -->
    <div id="adminModal" class="modal">
        <div class="modal-content">
            <h2>Subir Nuevo Juego</h2>
            <br>
            <input type="text" id="titulo" placeholder="Nombre del juego">
            <input type="text" id="version" placeholder="Versión (ej. v1.0)">
            <input type="text" id="size" placeholder="Tamaño (ej. 150 MB)">
            <textarea id="modFeatures" placeholder="Características del mod (ej. Dinero infinito)"></textarea>
            <input type="text" id="downloadUrl" placeholder="Enlace de descarga del APK">
            <br>
            <button onclick="subirJuego()">Publicar Juego</button>
            <button onclick="cerrarAdmin()" style="background: #444; color: #fff; margin-top: 5px;">Cerrar</button>
        </div>
    </div>

    <script>
        // Configuración de Supabase con tus credenciales
        const SUPABASE_URL = 'https://atrbkqiixifcdafvuvqb.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_Gp5PD8VF4jYGM6lZSS_iRw_z8J1AG9D';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function cargarJuegos() {
            const listDiv = document.getElementById('games-list');
            const { data, error } = await supabaseClient.from('games').select('*');

            if (error) {
                listDiv.innerHTML = '<p>Error al cargar los juegos.</p>';
                return;
            }

            if (data.length === 0) {
                listDiv.innerHTML = '<p>No hay juegos subidos todavía. ¡Usa el panel admin para subir uno!</p>';
                return;
            }

            listDiv.innerHTML = '';
            data.forEach(game => {
                listDiv.innerHTML += `
                    <div class="game-card">
                        <div class="game-info">
                            <h3>${game.title} (${game.version})</h3>
                            <p>Mod: ${game.mod_features}</p>
                            <p><small>Tamaño: ${game.file_size}</small></p>
                        </div>
                        <a href="${game.download_url}" target="_blank"><button>Descargar</button></a>
                    </div>
                `;
            });
        }

        function abrirAdmin() {
            document.getElementById('adminModal').style.display = 'flex';
        }

        function cerrarAdmin() {
            document.getElementById('adminModal').style.display = 'none';
        }

        async function subirJuego() {
            const title = document.getElementById('titulo').value;
            const version = document.getElementById('version').value;
            const file_size = document.getElementById('size').value;
            const mod_features = document.getElementById('modFeatures').value;
            const download_url = document.getElementById('downloadUrl').value;

            if (!title || !download_url) {
                alert('Por lo menos rellena el título y el enlace de descarga.');
                return;
            }

            const { error } = await supabaseClient.from('games').insert([
                { title, version, file_size, mod_features, download_url }
            ]);

            if (error) {
                alert('Error al subir el juego a la base de datos.');
            } else {
                alert('¡Juego publicado con éxito!');
                cerrarAdmin();
                cargarJuegos();
            }
        }

        // Cargar juegos al abrir la página
        cargarJuegos();
    </script>
</body>
</html>
